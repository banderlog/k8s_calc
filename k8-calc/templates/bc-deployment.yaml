---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: bc
  name: bc
spec:
  template:
    metadata:
      labels:
        app: bc
    spec:
      restartPolicy: Never
      containers:
        - name: bc
          image: busybox
          env:
            - name: INPUT
              valueFrom:
                configMapKeyRef:
                  name: calculateme-configmap
                  key: calculateme
          command: ['sh']
          args: ["-c", "echo ${INPUT} | bc -l > '/tmp/index.html'"]
          volumeMounts:
            - mountPath: /tmp
              name: exch-vol
      volumes:
        - name: exch-vol
          persistentVolumeClaim:
            claimName: exch-vol

